<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&amp;S — O Jogo · Convite (Edição Clássica)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital@0;1&family=Space+Mono:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:#c69a6b; --kraft-2:#bb8b58; --kraft-edge:#9c7040;
    --paper:#f3ead2; --paper-2:#e9dcbb;
    --red:#b23a26; --red-deep:#8a2a1c; --ribbon:#b1432c; --wax:#9c1f1c;
    --gold:#c9a24a; --gold-lt:#e6c877; --ink:#241d17; --green:#2f6b3f;
    --shadow:0 14px 40px rgba(40,20,10,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:'EB Garamond',Georgia,serif;color:var(--ink);
    background:radial-gradient(120% 90% at 50% 12%, #f0e3c4 0%, #e2cea4 55%, #cda878 100%);
    overflow:hidden;
  }
  /* hex board texture */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:
      linear-gradient(30deg, rgba(180,140,70,.13) 12%, transparent 12.5%, transparent 87%, rgba(180,140,70,.13) 87.5%),
      linear-gradient(150deg, rgba(180,140,70,.13) 12%, transparent 12.5%, transparent 87%, rgba(180,140,70,.13) 87.5%),
      linear-gradient(30deg, rgba(180,140,70,.13) 12%, transparent 12.5%, transparent 87%, rgba(180,140,70,.13) 87.5%),
      linear-gradient(150deg, rgba(180,140,70,.13) 12%, transparent 12.5%, transparent 87%, rgba(180,140,70,.13) 87.5%);
    background-size:42px 74px;background-position:0 0,0 0,21px 37px,21px 37px;
  }

  /* ===== CURTAIN ===== */
  #curtain{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center}
  #curtain .drape{position:absolute;top:0;bottom:0;width:51%;
    background:linear-gradient(90deg,#5c0d0d,#8e1414 18%,#b31d1d 32%,#7d1010 46%,#a81818 60%,#6d0e0e 78%,#8e1414);
    background-size:110px 100%;box-shadow:inset 0 0 140px rgba(0,0,0,.65);
    transition:transform 1.9s cubic-bezier(.66,0,.24,1)}
  #curtain .drape::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 7px,rgba(255,255,255,.05) 24px 34px)}
  #curtain .drape.l{left:0}#curtain .drape.r{right:0}
  #curtain.open .drape.l{transform:translateX(-102%)}
  #curtain.open .drape.r{transform:translateX(102%)}
  #curtain.closing .drape.l{transform:translateX(0)}
  #curtain.closing .drape.r{transform:translateX(0)}
  #curtain.gone{opacity:0;pointer-events:none;transition:opacity .5s .9s}
  .startbox{position:relative;z-index:2;text-align:center;color:#f4ecd8;padding:20px}
  .startbox .coin{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold-lt);animation:blink 1s steps(1) infinite;margin-bottom:24px}
  @keyframes blink{50%{opacity:0}}
  .startbox h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(28px,7vw,54px);margin:0 0 6px;color:#f6e7c4;text-shadow:0 3px 0 #6d0e0e,0 7px 20px rgba(0,0,0,.5)}
  .startbox p{font-style:italic;opacity:.85;margin:.2em 0 28px}
  .btn{font-family:'Press Start 2P',monospace;font-size:11px;background:var(--gold);color:#3a2410;border:0;padding:15px 24px;border-radius:6px;cursor:pointer;box-shadow:0 6px 0 #8a6a22,0 12px 22px rgba(0,0,0,.4)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6a22}

  /* ===== STAGE ===== */
  #stage{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;perspective:1600px}
  .scene{position:relative;width:min(94vw,440px);height:100%;max-height:860px}

  /* envelope */
  .env{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);width:100%;height:56%;z-index:6}
  .env .body{position:absolute;inset:0;background:linear-gradient(180deg,var(--kraft),var(--kraft-2));
    border:2px solid var(--kraft-edge);border-radius:10px 10px 6px 6px;box-shadow:var(--shadow)}
  .env .pocket{position:absolute;left:0;right:0;bottom:0;height:64%;background:linear-gradient(180deg,var(--kraft-2),#b1854f);
    border:2px solid var(--kraft-edge);border-top:3px solid rgba(90,60,30,.35);border-radius:6px;z-index:9}
  .env .pocket::before{content:"";position:absolute;left:8%;right:8%;top:6px;height:8px;background:rgba(255,245,225,.5);border-radius:4px}
  .env .ribbon{position:absolute;top:-40%;bottom:0;left:50%;width:16%;transform:translateX(-50%) rotate(1.5deg);
    background:linear-gradient(90deg,#9a3826,#c14c33,#9a3826);z-index:10}
  .env .ribbon::after{content:"";position:absolute;left:0;right:0;bottom:-26px;height:26px;
    background:linear-gradient(-45deg,transparent 49%,#a63f2b 50%) 0 0/13px 26px,
               linear-gradient(45deg,transparent 49%,#a63f2b 50%) 0 0/13px 26px}
  .env .flap{position:absolute;left:-1px;right:-1px;top:0;height:50%;
    background:linear-gradient(180deg,#c99a67,#bd8d59);border:2px solid var(--kraft-edge);
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s ease;z-index:12}
  .env.opened .flap{transform:rotateX(180deg) scaleY(.62);opacity:0;z-index:4}
  .env .seal{position:absolute;left:50%;top:44%;width:74px;height:74px;transform:translate(-50%,-50%);z-index:14;transition:transform .5s ease, opacity .5s}
  .env .seal .spikes{position:absolute;inset:-10px;z-index:-1}
  .env .seal .spikes i{position:absolute;left:50%;top:50%;width:14px;height:34px;background:#b1432c;transform-origin:bottom center;border-radius:3px}
  .env .seal .wax{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 30%,#d23b33,#9c1f1c 70%);
    box-shadow:inset 0 0 12px rgba(0,0,0,.4),0 4px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
  .env .seal .wax span{font-family:'Cinzel',serif;font-weight:900;color:#7d1512;font-size:22px}
  .env.opened .seal{transform:translate(-50%,-260%) rotate(24deg);opacity:0}

  /* card */
  .card{position:absolute;left:50%;top:50%;width:86%;aspect-ratio:63/97;transform:translate(-50%,140%) scale(.9);
    background:linear-gradient(180deg,#fbf5e4,#efe1c0);border-radius:14px;
    border:7px solid var(--gold-lt);box-shadow:var(--shadow),inset 0 0 0 2px var(--gold);
    z-index:8;opacity:0;transition:transform .6s cubic-bezier(.4,1.1,.4,1),opacity .4s;
    display:flex;flex-direction:column;overflow:hidden}
  .card.show{transform:translate(-50%,-52%) scale(1);opacity:1}
  .card.leaving{transform:translate(-160%,-70%) rotate(-16deg) scale(.9);opacity:0}
  .card .pip{position:absolute;font-family:'Cinzel',serif;font-weight:900;font-size:15px;line-height:1;color:var(--red-deep)}
  .card .pip.tl{top:8px;left:10px}.card .pip.br{bottom:8px;right:10px;transform:rotate(180deg)}
  .card .pip small{display:block;font-size:15px}
  .card .inner{flex:1;padding:30px 20px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;overflow:auto}
  .card h2{font-family:'Cinzel',serif;color:var(--red-deep);margin:0;font-size:clamp(19px,5vw,26px);line-height:1.15}
  .card h3{font-family:'Cinzel',serif;color:var(--kraft-edge);margin:2px 0;font-size:13px;letter-spacing:2px;text-transform:uppercase}
  .card p{margin:3px 0;font-size:clamp(14px,3.6vw,17px);line-height:1.35}
  .card .mono{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px}
  .card .big{font-family:'Cinzel',serif;font-size:clamp(24px,7vw,34px);color:var(--red-deep)}
  .card .rule{width:60%;border:0;border-top:2px dotted var(--kraft-edge);margin:6px 0}
  .card img.photo{max-height:56%;border-radius:8px;border:4px solid var(--gold-lt);box-shadow:0 8px 18px rgba(0,0,0,.3)}
  .card img.map{width:100%;border-radius:8px;border:2px solid var(--kraft-edge)}

  /* scrabble */
  .scrab{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  .stile{width:34px;height:34px;background:linear-gradient(160deg,#f6ecc9,#e6d29a);border-radius:5px;border:1px solid #b99a58;
    box-shadow:0 3px 0 #a5843f;font-family:'Cinzel',serif;font-weight:700;font-size:19px;color:#3a2a12;
    display:flex;align-items:center;justify-content:center;position:relative}
  .stile sub{position:absolute;right:3px;bottom:1px;font-size:8px;font-weight:400}

  /* elementos list */
  .elem{width:100%;text-align:left;display:flex;flex-direction:column;gap:9px}
  .elem .row{display:flex;gap:10px;align-items:flex-start}
  .elem .ic{font-size:20px;flex:0 0 24px;text-align:center}
  .elem .row b{color:var(--red-deep)}
  .elem .row small{display:block;font-size:13px;color:#4a3826}

  /* chip */
  .chip{width:150px;height:150px;border-radius:50%;position:relative;
    background:repeating-conic-gradient(var(--gold) 0 20deg,#fff 20deg 40deg);
    box-shadow:0 0 0 7px var(--gold-lt),0 0 0 11px #b98f38;
    display:flex;align-items:center;justify-content:center;animation:spin 9s linear infinite}
  .chip::before{content:"";position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--paper-2));box-shadow:inset 0 0 16px rgba(0,0,0,.2)}
  .chip span{position:relative;font-family:'Cinzel',serif;font-weight:900;font-size:40px;color:var(--red-deep)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .badge{background:var(--kraft-edge);color:var(--paper);font-family:'Space Mono',monospace;font-size:11px;padding:6px 10px;border-radius:16px}

  /* uno */
  .uno{width:120px;background:#111;border-radius:12px;padding:7px;transform:rotate(-5deg)}
  .uno .in{background:var(--red);border:4px solid #fff;border-radius:9px;padding:12px 6px;text-align:center;color:#fff}
  .uno .oval{background:#fff;color:var(--red);font-family:'Cinzel',serif;font-weight:900;font-style:italic;font-size:17px;border-radius:50%/42%;transform:rotate(-8deg)}

  /* carrier playing card */
  .carrier{position:absolute;left:50%;top:50%;width:74%;aspect-ratio:63/97;transform:translate(-50%,-52%) rotateY(90deg);
    background:#fdfdf8;border-radius:12px;border:2px solid #333;box-shadow:var(--shadow);z-index:20;opacity:0;
    display:flex;align-items:center;justify-content:center;transition:transform .4s ease,opacity .3s}
  .carrier.flash{animation:carry .55s ease}
  @keyframes carry{0%{opacity:0;transform:translate(-50%,-52%) rotateY(90deg)}
    35%{opacity:1;transform:translate(-50%,-52%) rotateY(0)}
    65%{opacity:1;transform:translate(-50%,-52%) rotateY(0)}
    100%{opacity:0;transform:translate(-50%,-52%) rotateY(-90deg)}}
  .carrier .cn{position:absolute;top:8px;left:10px;font-family:'Cinzel',serif;font-weight:900;color:#1c1c1c;font-size:20px;text-align:center;line-height:1}
  .carrier .cn.b{top:auto;left:auto;bottom:8px;right:10px;transform:rotate(180deg)}
  .carrier .suit{font-size:74px;color:#1c1c1c}

  /* controls */
  #hud{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;
    opacity:0;transition:opacity .5s;pointer-events:none}
  #hud.on{opacity:1;pointer-events:auto}
  .pips{display:flex;gap:7px}
  .pips i{width:9px;height:9px;border-radius:50%;background:rgba(120,80,40,.35);transition:.3s;cursor:pointer}
  .pips i.act{background:var(--red-deep);transform:scale(1.35)}
  .nav{display:flex;gap:8px}
  .nav button{font-family:'Space Mono',monospace;font-weight:700;font-size:12px;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;
    background:var(--kraft-edge);color:var(--paper);box-shadow:0 4px 0 #6e4e28}
  .nav button:active{transform:translateY(3px);box-shadow:0 1px 0 #6e4e28}
  .nav button.primary{background:var(--red);box-shadow:0 4px 0 var(--red-deep)}
  .tap-hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:29;font-family:'Space Mono',monospace;font-size:12px;
    color:#5a3d28;background:rgba(255,250,235,.8);padding:6px 12px;border-radius:14px;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
  @keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}

  /* name-check card fields */
  .nc input{font-family:'EB Garamond',serif;font-size:16px;padding:10px 12px;border:2px solid var(--kraft-edge);border-radius:9px;background:#fffdf5;width:100%;max-width:240px}
  .nc button{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;background:var(--red);color:#fff;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;box-shadow:0 4px 0 var(--red-deep);margin-top:8px}
  .nc .res{margin-top:10px;font-size:14px;min-height:1em}
  .nc .res.ok{color:var(--green)}.nc .res.no{color:var(--red-deep)}.nc .res.ask{color:#8a6a1e}
  .nc .res a{color:var(--red)}

  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.2s!important}.chip{animation:none}}
</style>
</head>
<body>

<div id="curtain">
  <div class="drape l"></div>
  <div class="drape r"></div>
  <div class="startbox">
    <div class="coin">◉ INSIRA UMA MOEDA ◉</div>
    <h1>M&amp;S — O JOGO</h1>
    <p>Expansão: Aliança Estratégica</p>
    <button class="btn" id="startBtn">▶ ABRIR O CONVITE</button>
  </div>
</div>

<div id="stage">
  <div class="scene">
    <div class="env" id="env">
      <div class="body"></div>
      <div class="ribbon"></div>
      <div class="flap"></div>
      <div class="pocket"></div>
      <div class="seal" id="seal">
        <div class="spikes">
          <i style="transform:translate(-50%,-100%) rotate(-32deg)"></i>
          <i style="transform:translate(-50%,-100%) rotate(-12deg)"></i>
          <i style="transform:translate(-50%,-100%) rotate(10deg)"></i>
          <i style="transform:translate(-50%,-100%) rotate(30deg)"></i>
        </div>
        <div class="wax"><span>M&amp;S</span></div>
      </div>
    </div>

    <div class="carrier" id="carrier">
      <div class="cn">J<br>♠</div><div class="cn b">J<br>♠</div>
      <div class="suit">♠</div>
    </div>

    <div class="card" id="card">
      <div class="pip tl" id="pipTL">M<small>♥</small></div>
      <div class="pip br" id="pipBR">S<small>♠</small></div>
      <div class="inner" id="cardInner"></div>
    </div>
  </div>
</div>

<div class="tap-hint" id="tapHint" hidden>toca no ecrã para avançar ›</div>

<div id="hud">
  <div class="pips" id="pips"></div>
  <div class="nav">
    <button id="prev">‹ ANTERIOR</button>
    <button id="next" class="primary">SEGUINTE ›</button>
    <button id="replay">↺ REPETIR</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var scores={a:1,b:3,c:3,d:2,e:1,f:4,g:2,h:4,i:1,j:8,l:1,m:3,n:1,o:1,p:3,q:10,r:1,s:1,t:1,u:1,v:4,x:8,z:10,k:5,w:4,y:4};
  function tiles(name){
    return '<div class="scrab">'+name.toUpperCase().split('').map(function(ch){
      var s=scores[ch.toLowerCase()];
      return '<div class="stile">'+(ch===' '?'&nbsp;':ch)+(s?'<sub>'+s+'</sub>':'')+'</div>';
    }).join('')+'</div>';
  }

  /* ---------- guest list + search (shared logic with the deluxe version) ---------- */
  var GUESTS=[
    "Nuno Moreira","Mónica Mateos","Miguel Comba","Sofia Moreira",
    "António Moreira","Pedro Mateos","Maria Silva","Maria Santos","Maria Comba",
    "João Ferreira","João Costa","Ana Rodrigues","Beatriz Lopes","Rita Fonseca",
    "Carlos Mendes","Tiago Fernandes","Inês Pereira","André Comba","Catarina Silva",
    "Ricardo Almeida","Joana Marques","Bruno Nunes","Helena Dias","Francisco Gomes"
  ];
  function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/\s+/g,' ');}
  var DB=GUESTS.map(function(f){var p=norm(f).split(' ');return {full:f,first:p[0],last:p[p.length-1],parts:p};});
  function search(raw){
    var q=norm(raw);if(!q)return {t:'empty'};
    var toks=q.split(' ');
    if(toks.length>=2){
      var m=DB.filter(function(g){return toks.every(function(t){return g.parts.indexOf(t)>-1;});});
      if(m.length===1)return {t:'ok',g:m[0]};
      if(m.length>1)return {t:'ask',m:m};
      return {t:'no'};
    }
    var t=toks[0];
    var bf=DB.filter(function(g){return g.first===t;});
    if(bf.length===1)return {t:'ok',g:bf[0]};
    if(bf.length>1)return {t:'ask',m:bf,tok:raw.trim(),by:'primeiro nome'};
    var bl=DB.filter(function(g){return g.last===t;});
    if(bl.length===1)return {t:'ok',g:bl[0]};
    if(bl.length>1)return {t:'ask',m:bl,tok:raw.trim(),by:'apelido'};
    return {t:'no'};
  }

    var box=document.getElementById('ncres');if(!box)return;

      card.classList.remove('show');
    }
    // carrier playing-card flourish
    carrier.classList.remove('flash');void carrier.offsetWidth;carrier.classList.add('flash');
    setTimeout(function(){
      card.classList.remove('leaving');
      idx=i;
      renderStep(i);
      paintPips();
      void card.offsetWidth;
      card.classList.add('show');
      busy=false;
      if(!steps[i].nc && i<steps.length-1) scheduleAuto();
      if(i===steps.length-1){ endShow(); }
    }, idx>=0?170:110);
  }

  function scheduleAuto(){ stopAuto(); if(manual)return; autoTimer=setTimeout(function(){ if(idx<steps.length-1) go(idx+1); }, 6800); }
  function stopAuto(){ if(autoTimer){clearTimeout(autoTimer);autoTimer=null;} }

  function endShow(){
    // gentle curtain close after the last card lingers
    stopAuto();
    setTimeout(function(){
      if(idx!==steps.length-1)return;
    },100);
  }

  function begin(){
    if(started)return;started=true;
    curtain.classList.add('open');
    setTimeout(function(){curtain.classList.add('gone');},1600);
    setTimeout(function(){ env.classList.remove('opened'); },300);
    setTimeout(function(){ env.classList.add('opened'); },1300);   // seal breaks, flap opens
    setTimeout(function(){ hud.classList.add('on'); tapHint.hidden=false; go(0); },2100);
  }
  document.getElementById('startBtn').addEventListener('click',begin);

  document.getElementById('next').addEventListener('click',function(){manual=true;stopAuto();go(idx+1);});
  document.getElementById('prev').addEventListener('click',function(){manual=true;stopAuto();go(idx-1);});
  document.getElementById('replay').addEventListener('click',function(){
    stopAuto();
    curtain.classList.remove('gone','open');curtain.classList.add('closing');
    setTimeout(function(){
      curtain.classList.remove('closing');
      card.classList.remove('show');idx=-1;started=false;manual=false;
      env.classList.remove('opened');
      hud.classList.remove('on');tapHint.hidden=true;
      begin();
    },1400);
  });

  // tap anywhere on the stage advances
  document.getElementById('stage').addEventListener('click',function(e){
    if(!started||busy)return;
    if(e.target.closest('.nc'))return;
    tapHint.hidden=true;
    if(idx<steps.length-1) go(idx+1);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){manual=true;stopAuto();go(idx+1);}
    if(e.key==='ArrowLeft'){manual=true;stopAuto();go(idx-1);}
  });
})();
</script>
</body>
</html>
