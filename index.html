<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>M&amp;S — O Jogo  ·  Convite de Casamento</title>
<meta name="description" content="Miguel Comba &amp; Sofia Moreira — 12 de Junho de 2027. M&S, O Jogo · Expansão: Aliança Estratégica.">
<meta name="robots" content="noindex">
<meta property="og:title" content="M&amp;S — O Jogo">
<meta property="og:description" content="A tua presença é requisitada no tabuleiro. 12 de Junho de 2027.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts identified from the original invitation assets:
     · game / UI text  -> IBM Plex Mono   (swap in ../ if the real one turns out to be Fira Mono / Ubuntu Mono)
     · couple names     -> Playfair Display
     · section headers  -> EB Garamond
     · arcade bits      -> Press Start 2P / Cinzel wordmark -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:#c69a6b; --kraft-2:#bb8b58; --kraft-edge:#9c7040;
    --paper:#f3ead2; --paper-2:#e9dcbb; --card:#f6efdc;
    --red:#b23a26; --red-deep:#8a2a1c; --ribbon:#b1432c;
    --gold:#c9a24a; --gold-lt:#e6c877; --gold-dk:#a9832f;
    --ink:#241d17; --ink-soft:#4a3826; --green:#2f6b3f;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --display:'Playfair Display',Georgia,serif;
    --serif:'EB Garamond',Georgia,serif;
    --shadow:0 14px 40px rgba(40,20,10,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:var(--serif);color:var(--ink);
    background:#d8c9a6 url("final/assets/hexbg.jpg") center/cover fixed no-repeat;
    overflow:hidden;
  }

  /* ===== CURTAIN ===== */
  #curtain{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center}
  #curtain .drape{position:absolute;top:0;bottom:0;width:51%;
    background:linear-gradient(90deg,#5c0d0d,#8e1414 18%,#b31d1d 32%,#7d1010 46%,#a81818 60%,#6d0e0e 78%,#8e1414);
    background-size:110px 100%;box-shadow:inset 0 0 140px rgba(0,0,0,.65);
    transition:transform 1.9s cubic-bezier(.66,0,.24,1)}
  #curtain .drape::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 7px,rgba(255,255,255,.05) 24px 34px)}
  #curtain .drape.l{left:0}#curtain .drape.r{right:0}
  #curtain.open .drape.l{transform:translateX(-102%)}
  #curtain.open .drape.r{transform:translateX(102%)}
  #curtain.closing .drape.l,#curtain.closing .drape.r{transform:translateX(0)}
  #curtain.gone{opacity:0;pointer-events:none;transition:opacity .5s .9s}
  .startbox{position:relative;z-index:2;text-align:center;color:#f4ecd8;padding:20px}
  .startbox .coin{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--gold-lt);animation:blink 1s steps(1) infinite;margin-bottom:22px}
  @keyframes blink{50%{opacity:0}}
  .startbox h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(28px,7vw,54px);margin:0 0 6px;color:#f6e7c4;text-shadow:0 3px 0 #6d0e0e,0 7px 20px rgba(0,0,0,.5)}
  .startbox p{font-style:italic;opacity:.85;margin:.2em 0 26px;font-family:var(--serif);font-size:18px}
  .btn{font-family:'Press Start 2P',monospace;font-size:11px;background:var(--gold);color:#3a2410;border:0;padding:15px 22px;border-radius:6px;cursor:pointer;box-shadow:0 6px 0 #8a6a22,0 12px 22px rgba(0,0,0,.4)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6a22}

  /* ===== FLOATING PIECES ===== */
  .floaties{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .floaty{position:absolute;font-size:26px;opacity:.13;animation:drift linear infinite}
  @keyframes drift{0%{transform:translateY(112vh) rotate(0)}100%{transform:translateY(-14vh) rotate(360deg)}}

  /* ===== STAGE ===== */
  #stage{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;perspective:1600px}
  .scene{position:relative;width:min(94vw,440px);height:100%;max-height:900px}

  /* envelope */
  .env{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);width:100%;height:55%;z-index:6}
  .env .body{position:absolute;inset:0;background:linear-gradient(180deg,var(--kraft),var(--kraft-2));border:2px solid var(--kraft-edge);border-radius:10px 10px 6px 6px;box-shadow:var(--shadow)}
  .env .pocket{position:absolute;left:0;right:0;bottom:0;height:64%;background:linear-gradient(180deg,var(--kraft-2),#b1854f);border:2px solid var(--kraft-edge);border-top:3px solid rgba(90,60,30,.35);border-radius:6px;z-index:9}
  .env .pocket::before{content:"";position:absolute;left:8%;right:8%;top:6px;height:8px;background:rgba(255,245,225,.5);border-radius:4px}
  .env .ribbon{position:absolute;top:-40%;bottom:0;left:50%;width:15%;transform:translateX(-50%) rotate(1.5deg);background:linear-gradient(90deg,#9a3826,#c14c33,#9a3826);z-index:10}
  .env .ribbon::after{content:"";position:absolute;left:0;right:0;bottom:-24px;height:24px;
    background:linear-gradient(-45deg,transparent 49%,#a63f2b 50%) 0 0/12px 24px,linear-gradient(45deg,transparent 49%,#a63f2b 50%) 0 0/12px 24px}
  .env .flap{position:absolute;left:-1px;right:-1px;top:0;height:50%;background:linear-gradient(180deg,#c99a67,#bd8d59);border:2px solid var(--kraft-edge);
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s ease,opacity 1s ease;z-index:12}
  .env.opened .flap{transform:rotateX(180deg) scaleY(.62);opacity:0;z-index:4}
  .env .seal{position:absolute;left:50%;top:44%;width:96px;height:96px;transform:translate(-50%,-50%);z-index:14;transition:transform .55s ease,opacity .55s}
  .env .seal img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}
  .env.opened .seal{transform:translate(-50%,-280%) rotate(26deg);opacity:0}

  /* carrier = the player's own playing card */
  .carrier{position:absolute;left:50%;top:50%;width:72%;aspect-ratio:63/97;transform:translate(-50%,-52%) rotateY(90deg);
    z-index:20;opacity:0;transition:transform .4s ease,opacity .3s;transform-style:preserve-3d}
  .carrier.flash{animation:carry .62s ease}
  @keyframes carry{0%{opacity:0;transform:translate(-50%,-52%) rotateY(92deg) scale(.96)}
    38%{opacity:1;transform:translate(-50%,-52%) rotateY(0) scale(1)}
    66%{opacity:1;transform:translate(-50%,-52%) rotateY(0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-52%) rotateY(-92deg) scale(.96)}}
  .pcard{position:absolute;inset:0;border-radius:12px;background:#fdfdf8;border:2px solid #2a2a2a;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pcard .cnr{position:absolute;font-family:var(--display);font-weight:900;line-height:.82;text-align:center;font-size:clamp(14px,3.8vw,18px)}
  .pcard .cnr.tl{top:8px;left:10px}
  .pcard .cnr.br{bottom:8px;right:10px;transform:rotate(180deg)}
  .pcard .mid{font-size:clamp(48px,14vw,66px);line-height:1}
  .pcard.red{color:#c0392b}.pcard.black{color:#1f1f1f}
  .pcard.joker{color:#7d4bd0}
  .pcard.back{background:repeating-linear-gradient(45deg,#8a2a1c 0 7px,#a5321f 7px 14px);border-color:#6d1c11}
  .pcard.back span{font-family:var(--display);font-weight:900;font-size:30px;color:#f3ead2;
    background:rgba(138,42,28,.9);border:2px solid #f3ead2;border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center}

  /* content card */
  .card{position:absolute;left:50%;top:50%;width:88%;aspect-ratio:63/97;transform:translate(-50%,140%) scale(.9);
    background:var(--card) url("final/assets/hexbg.jpg") center/200% no-repeat;background-blend-mode:overlay;
    border-radius:14px;border:7px solid var(--gold-lt);box-shadow:var(--shadow),inset 0 0 0 2px var(--gold);
    z-index:8;opacity:0;transition:transform .6s cubic-bezier(.4,1.1,.4,1),opacity .4s;display:flex;flex-direction:column;overflow:hidden}
  .card.show{transform:translate(-50%,-52%) scale(1);opacity:1}
  .card.leaving{transform:translate(-165%,-70%) rotate(-15deg) scale(.9);opacity:0}
  /* inner gold frame — the boardgame-box look */
  .card::before{content:"";position:absolute;inset:9px;border:1.5px solid var(--gold-dk);border-radius:8px;opacity:.6;pointer-events:none;z-index:3}
  .card .cnr{position:absolute;font-family:var(--display);font-weight:900;font-size:15px;line-height:.82;color:var(--red-deep);z-index:4}
  .card .cnr.tl{top:9px;left:12px}.card .cnr.br{bottom:9px;right:12px;transform:rotate(180deg)}
  .card .inner{flex:1;padding:26px 19px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;overflow:auto}
  .card .inner::-webkit-scrollbar{width:0}
  .card h2{font-family:var(--display);font-weight:700;color:var(--red-deep);margin:0;font-size:clamp(20px,5.4vw,28px);line-height:1.12}
  .card h3{font-family:var(--serif);font-weight:500;color:var(--kraft-edge);margin:2px 0;font-size:13px;letter-spacing:3px;text-transform:uppercase}
  .card .kicker{font-family:var(--serif);font-size:clamp(24px,6vw,32px);color:var(--gold-dk);margin:0;letter-spacing:.5px}
  .card p{margin:3px 0;font-size:clamp(13px,3.5vw,15.5px);line-height:1.36}
  .card .mono{font-family:var(--mono);font-size:12px;letter-spacing:0}
  .card .big{font-family:var(--display);font-weight:700;font-size:clamp(24px,7vw,33px);color:var(--red-deep)}
  .card .amp{height:1em;vertical-align:-.12em;mix-blend-mode:multiply}
  .card hr.rule{width:62%;border:0;border-top:2px dotted var(--kraft-edge);margin:6px 0}
  .card a{color:var(--red);font-weight:600}
  .card img.photo{max-height:42%;border-radius:8px;border:4px solid var(--gold-lt);box-shadow:0 8px 18px rgba(0,0,0,.3)}
  .gico{width:auto;vertical-align:middle}

  /* scrabble tiles */
  .scrab{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:2px 0}
  .stile{width:30px;height:30px;background:linear-gradient(160deg,#f6ecc9,#e6d29a);border-radius:5px;border:1px solid #b99a58;
    box-shadow:0 3px 0 #a5843f;font-family:var(--display);font-weight:700;font-size:17px;color:#7a5a1e;
    display:flex;align-items:center;justify-content:center;position:relative;transform:translateY(-90px);opacity:0}
  .stile.drop{animation:drop .45s cubic-bezier(.3,1.4,.5,1) forwards}
  @keyframes drop{to{transform:none;opacity:1}}
  .stile sub{position:absolute;right:2px;bottom:0;font-size:8px;font-weight:400}

  /* elementos list */
  .elem{width:100%;text-align:left;display:flex;flex-direction:column;gap:9px}
  .elem .row{display:flex;gap:11px;align-items:flex-start}
  .elem .row>img{width:40px;flex:0 0 40px;object-fit:contain;margin-top:2px}
  .elem .row b{color:var(--red-deep);font-family:var(--mono);font-weight:600;font-size:13.5px;letter-spacing:-.3px}
  .elem .row small{display:block;font-size:12.5px;color:var(--ink-soft);line-height:1.32;font-family:var(--serif)}

  /* stat / box-back grid */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;font-family:var(--mono);font-size:11px}
  .stats div{background:rgba(255,250,235,.62);border:1px solid var(--kraft-edge);border-radius:6px;padding:6px 8px;text-align:left}
  .stats b{color:var(--red-deep);display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:1px}

  /* boardgame stat badges (extracted from the poker-chip asset) */
  .badges3{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
  .badges3 img{height:44px;width:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}

  .chipimg{width:clamp(120px,34vw,160px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}

  /* timeline */
  .phases{width:100%;display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:12.5px}
  .phases div{display:flex;gap:10px;align-items:baseline}
  .phases b{color:var(--red-deep);font-weight:700;min-width:34px}
  .phases i{flex:1;border-bottom:1px dotted var(--kraft-edge);font-style:normal}

  /* map */
  svg.map{width:100%;height:auto;border-radius:8px;border:2px solid var(--kraft-edge);background:#e8f1e6}
  .legend{width:100%;display:flex;flex-direction:column;gap:7px;text-align:left;margin-top:4px}
  .legend .row{display:flex;gap:9px;align-items:flex-start}
  .legend .row img{width:30px;flex:0 0 30px;object-fit:contain}
  .legend .row small{font-family:var(--mono);font-size:11px;line-height:1.3}
  .legend .row small b{color:var(--red-deep)}

  /* objetivos / regras with role icons */
  .role{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:2px}
  .role img{height:44px;width:auto}
  .role span{font-family:var(--serif);font-size:clamp(20px,5.5vw,26px);color:var(--gold-dk)}
  .ruleslist{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px}
  .ruleslist .r{display:flex;gap:8px;font-size:12.5px;line-height:1.3}
  .ruleslist .r span{flex:0 0 16px;text-align:center}

  .uno{width:78px;transform:rotate(-5deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
  .uno img{width:100%;display:block}

  .rsvp{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .rsvp button{text-decoration:none;font-family:var(--mono);font-weight:700;font-size:12px;padding:10px 14px;border-radius:9px;
    border:0;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s,opacity .2s}
  .rsvp button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .rsvp button:disabled{opacity:.55;cursor:default;transform:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .rsvp .yes{background:var(--green);color:#fff}
  .rsvp .no{background:#7a7a7a;color:#fff}
  .rsvp-status{min-height:1.1em;font-size:12.5px;font-family:var(--mono)}
  .rsvp-status.ok{color:var(--green)}
  .rsvp-status.err{color:var(--red-deep)}

  .finale{display:flex;gap:16px;align-items:center;justify-content:center}
  .finale img{height:clamp(40px,12vw,54px);width:auto;mix-blend-mode:multiply}

  /* name-check */
  .nc{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
  .nc input{font-family:var(--serif);font-size:16px;padding:10px 12px;border:2px solid var(--kraft-edge);border-radius:9px;background:#fffdf5;width:100%;max-width:250px;text-align:center}
  .nc button{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--red);color:#fff;border:0;border-radius:9px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 var(--red-deep)}
  .nc button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-deep)}
  .nc .res{font-size:13px;line-height:1.35;font-family:var(--serif)}
  .nc .res.ask{color:#8a6a1e}.nc .res.no{color:var(--red-deep)}
  .nc .res .opt{display:inline-block;background:rgba(255,250,235,.72);border:1px solid var(--kraft-edge);border-radius:6px;padding:2px 7px;margin:3px 3px 0;cursor:pointer;font-weight:600}

  /* HUD */
  #hud{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:9px;
    padding:12px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    opacity:0;transition:opacity .5s;pointer-events:none}
  #hud.on{opacity:1;pointer-events:auto}
  .pips{display:flex;gap:6px}
  .pips i{width:8px;height:8px;border-radius:50%;background:rgba(120,80,40,.35);transition:.3s;cursor:pointer}
  .pips i.act{background:var(--red-deep);transform:scale(1.4)}
  .nav{display:flex;gap:8px}
  .nav button{font-family:var(--mono);font-weight:700;font-size:12px;border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:var(--kraft-edge);color:var(--paper);box-shadow:0 4px 0 #6e4e28}
  .nav button:active{transform:translateY(3px);box-shadow:0 1px 0 #6e4e28}
  .nav button.primary{background:var(--red);box-shadow:0 4px 0 var(--red-deep)}
  .nav button:disabled{opacity:.4}
  .quip{position:fixed;left:50%;top:9%;transform:translateX(-50%);z-index:25;font-family:'Press Start 2P',monospace;font-size:10px;
    color:#fff;background:rgba(138,42,28,.92);padding:8px 12px;border-radius:8px;opacity:0;pointer-events:none;white-space:nowrap}
  .quip.show{animation:quip 1.5s ease}
  @keyframes quip{0%{opacity:0;transform:translateX(-50%) translateY(-6px)}15%,70%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0}}
  .tap-hint{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:24;font-family:var(--mono);font-size:12px;
    color:#5a3d28;background:rgba(255,250,235,.82);padding:5px 11px;border-radius:13px;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
  @keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.25s!important}}
</style>
</head>
<body>

<div class="floaties" id="floaties"></div>

<div id="curtain">
  <div class="drape l"></div><div class="drape r"></div>
  <div class="startbox">
    <div class="coin">◉ INSIRA UMA MOEDA ◉</div>
    <h1>M&amp;S — O JOGO</h1>
    <p>Expansão: Aliança Estratégica</p>
    <button class="btn" id="startBtn">▶ ABRIR O CONVITE</button>
  </div>
</div>

<div id="stage">
  <div class="scene">
    <div class="env" id="env">
      <div class="body"></div>
      <div class="ribbon"></div>
      <div class="flap"></div>
      <div class="pocket"></div>
      <div class="seal" id="seal"><img src="final/assets/seal.jpg" alt="Selo M&amp;S"></div>
    </div>
    <div class="carrier" id="carrier"><div class="pcard back"><span>M&amp;S</span></div></div>
    <div class="card" id="card">
      <div class="cnr tl" id="cnrTL">M♥</div>
      <div class="cnr br" id="cnrBR">S♠</div>
      <div class="inner" id="cardInner"></div>
    </div>
  </div>
</div>

<div class="quip" id="quip"></div>
<div class="tap-hint" id="tapHint" hidden>toca no ecrã para avançar ›</div>

<div id="hud">
  <div class="pips" id="pips"></div>
  <div class="nav">
    <button id="prev">‹</button>
    <button id="next" class="primary">SEGUINTE ›</button>
    <button id="replay">↺</button>
  </div>
</div>

  }

  function go(i){
    if(busy||i<0||i>=steps.length||i===idx)return;
    if(i>0 && !identified){ flash(); return; }
    busy=true;stopAuto();
    if(idx>=0){card.classList.add('leaving');card.classList.remove('show');}
    carrier.classList.remove('flash');void carrier.offsetWidth;
    setCarrier(identified?player:undefined);
    carrier.classList.add('flash');
    showQuip();
    setTimeout(function(){
      card.classList.remove('leaving');
      idx=i;renderStep(i);paintPips();
      void card.offsetWidth;card.classList.add('show');
      busy=false;
      if(i>0 && i<steps.length-1) scheduleAuto();
    }, idx>=0?170:110);
  }
  function flash(){card.animate([{transform:'translate(-50%,-52%) scale(1)'},{transform:'translate(-50%,-52%) scale(1.02) rotate(-1deg)'},{transform:'translate(-50%,-52%) scale(1)'}],{duration:220});}
  function scheduleAuto(){stopAuto();if(manual)return;autoTimer=setTimeout(function(){if(idx<steps.length-1)go(idx+1);},7200);}
  function stopAuto(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}

  function wireRsvp(){
    var who = player ? player.names.join(' & ') : '';
    var buttons=[].slice.call(document.querySelectorAll('.rsvp button'));
    var status=document.getElementById('rsvpStatus');

    buttons.forEach(function(btn){
      btn.addEventListener('click',function(){
        var attend=btn.dataset.attend;
        var msg = attend==='yes'
          ? "Olá Miguel e Sofia! 🎲\n\nJogador(es): "+(who||"(escrever nome)")+"\nCarta: "+(player?cardLabel(player):"-")+"\nConfirmo presença em 12/06/2027: SIM\nNº de acompanhantes: \nRestrições alimentares: \n\nAté ao tabuleiro!"
          : "Olá Miguel e Sofia!\n\nJogador(es): "+(who||"(escrever nome)")+"\nInfelizmente não vamos conseguir jogar em 12/06/2027.\nUm abraço!";
        status.className='rsvp-status ok';
        status.textContent = attend==='yes' ? '🎲 A abrir o WhatsApp…' : 'A abrir o WhatsApp…';
        window.open('https://wa.me/'+RSVP_WHATSAPP.replace(/[^\d]/g,'')+'?text='+encodeURIComponent(msg), '_blank');
      });
    });
  }

  function wireGreet(){
    if(identified)return;
    var wrap=document.createElement('div');wrap.className='nc';
    wrap.innerHTML='<input id="ncq" type="text" placeholder="O teu nome (ex.: Nuno)" autocomplete="off" spellcheck="false">'+
                   '<button id="ncgo">PROCURAR</button><div class="res" id="ncres"></div>';
    inner.appendChild(wrap);
    var q=document.getElementById('ncq'),go2=document.getElementById('ncgo'),res=document.getElementById('ncres');
    function run(){
      var r=search(q.value);
      if(r.t==='empty'){res.className='res ask';res.textContent='Escreve o teu nome.';return;}
      if(r.t==='ok'){ identify(r.g); return; }
      if(r.t==='ask'){
        res.className='res ask';
        res.innerHTML='Há mais do que um jogador. Toca no teu nome:<br>'+
          r.list.map(function(g,k){return '<span class="opt" data-k="'+k+'">'+g.names.join(' & ')+'</span>';}).join('');
        res.querySelectorAll('.opt').forEach(function(el){el.addEventListener('click',function(){identify(r.list[+el.dataset.k]);});});
        return;
      }
      res.className='res no';
      res.innerHTML='<b>GAME OVER</b> — não encontrámos "'+q.value.trim()+'" no baralho.<br>'+
        '<span class="opt" id="joker">Entrar como JOKER</span> ou confirmar com os noivos.';
      document.getElementById('joker').addEventListener('click',function(){ identify(null); });
    }
    go2.addEventListener('click',run);
    q.addEventListener('keydown',function(e){if(e.key==='Enter')run();});
    setTimeout(function(){try{q.focus();}catch(e){}},400);
  }
  function identify(g){
    player=g; identified=true;
    setCarrier(player);
    inner.innerHTML=steps[0].build();
    dropTiles(inner);
    setCnr([cardLabel(player),cardLabel(player)]);
    btnNext.disabled=false; tapHint.hidden=false;
    carrier.classList.remove('flash');void carrier.offsetWidth;carrier.classList.add('flash');
    quip.textContent = player ? ('A tua carta: '+cardLabel(player)) : 'Curinga selvagem!';
    quip.classList.remove('show');void quip.offsetWidth;quip.classList.add('show');
  }

  function begin(){
    if(started)return;started=true;
    curtain.classList.add('open');
    setTimeout(function(){curtain.classList.add('gone');},1600);
    setTimeout(function(){env.classList.add('opened');},1300);
    setTimeout(function(){hud.classList.add('on');go(0);btnNext.disabled=true;},2000);
  }
  document.getElementById('startBtn').addEventListener('click',begin);

  btnNext.addEventListener('click',function(){manual=true;stopAuto();go(idx+1);});
  btnPrev.addEventListener('click',function(){manual=true;stopAuto();go(idx-1);});
  document.getElementById('replay').addEventListener('click',function(){
    stopAuto();
    curtain.classList.remove('gone','open');curtain.classList.add('closing');
    setTimeout(function(){
      curtain.classList.remove('closing');
      card.classList.remove('show');idx=-1;started=false;manual=false;identified=false;player=null;
      setCarrier(undefined);env.classList.remove('opened');
      hud.classList.remove('on');tapHint.hidden=true;
      begin();
    },1500);
  });
  document.getElementById('stage').addEventListener('click',function(e){
    if(!started||busy)return;
    if(e.target.closest('.nc')||e.target.closest('a')||e.target.closest('.rsvp')||e.target.closest('button'))return;
    if(idx===0 && !identified)return;
    tapHint.hidden=true;
    if(idx<steps.length-1) go(idx+1);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){manual=true;stopAuto();go(idx+1);}
    if(e.key==='ArrowLeft'){manual=true;stopAuto();go(idx-1);}
  });
})();
</script>
</body>
</html>
