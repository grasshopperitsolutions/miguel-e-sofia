<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>M&amp;S — O Jogo  ·  Convite de Casamento</title>
<meta name="description" content="Miguel Comba &amp; Sofia Moreira — 12 de Junho de 2027. M&S, O Jogo · Expansão: Aliança Estratégica.">
<meta name="robots" content="noindex">
<meta property="og:title" content="M&amp;S — O Jogo">
<meta property="og:description" content="A tua presença é requisitada no tabuleiro. 12 de Junho de 2027.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts identified from the original invitation assets:
     · game / UI text  -> IBM Plex Mono   (swap in ../ if the real one turns out to be Fira Mono / Ubuntu Mono)
     · standard font    -> IM Fell English (self-hosted, ../fonts/IM_Fell_English/)
     · arcade bits      -> Press Start 2P (self-hosted) / Cinzel wordmark
     · card suits/naipe -> Play (self-hosted, ../fonts/Play/) -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'IM Fell English';font-style:normal;font-weight:400;font-display:swap;
    src:url('../fonts/IM_Fell_English/IMFellEnglish-Regular.ttf') format('truetype')}
  @font-face{font-family:'IM Fell English';font-style:italic;font-weight:400;font-display:swap;
    src:url('../fonts/IM_Fell_English/IMFellEnglish-Italic.ttf') format('truetype')}
  @font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:swap;
    src:url('../fonts/Press_Start_2P/PressStart2P-Regular.ttf') format('truetype')}
  @font-face{font-family:'Play';font-style:normal;font-weight:400;font-display:swap;
    src:url('../fonts/Play/Play-Regular.ttf') format('truetype')}
  @font-face{font-family:'Play';font-style:normal;font-weight:700;font-display:swap;
    src:url('../fonts/Play/Play-Bold.ttf') format('truetype')}
  :root{
    --kraft:#c69a6b; --kraft-2:#bb8b58; --kraft-edge:#9c7040;
    --paper:#f3ead2; --paper-2:#e9dcbb; --card:#f6efdc;
    --red:#b23a26; --red-deep:#8a2a1c; --ribbon:#b1432c;
    --gold:#c9a24a; --gold-lt:#e6c877; --gold-dk:#a9832f;
    --ink:#241d17; --ink-soft:#4a3826; --green:#2f6b3f;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --display:'IM Fell English',Georgia,serif;
    --serif:'IM Fell English',Georgia,serif;
    --retro:'Press Start 2P',monospace;
    --naipe:'Play',Georgia,serif;
    --shadow:0 14px 40px rgba(40,20,10,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:var(--serif);color:var(--ink);
    background:#d8c9a6 url("../assets/hexbg.jpg") center/cover fixed no-repeat;
    overflow:hidden;
  }

  /* ===== CURTAIN ===== */
  #curtain{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center}
  #curtain .drape{position:absolute;top:0;bottom:0;width:51%;
    background:linear-gradient(90deg,#5c0d0d,#8e1414 18%,#b31d1d 32%,#7d1010 46%,#a81818 60%,#6d0e0e 78%,#8e1414);
    background-size:110px 100%;box-shadow:inset 0 0 140px rgba(0,0,0,.65);
    transition:transform 1.9s cubic-bezier(.66,0,.24,1)}
  #curtain .drape::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 7px,rgba(255,255,255,.05) 24px 34px)}
  #curtain .drape.l{left:0}#curtain .drape.r{right:0}
  #curtain.open .drape.l{transform:translateX(-102%)}
  #curtain.open .drape.r{transform:translateX(102%)}
  #curtain.closing .drape.l,#curtain.closing .drape.r{transform:translateX(0)}
  #curtain.gone{opacity:0;pointer-events:none;transition:opacity .5s .9s}
  .startbox{position:relative;z-index:2;text-align:center;color:#f4ecd8;padding:20px}
  .startbox .coin{font-family:var(--retro);font-size:11px;color:var(--gold-lt);animation:blink 1s steps(1) infinite;margin-bottom:22px}
  @keyframes blink{50%{opacity:0}}
  .startbox h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(28px,7vw,54px);margin:0 0 6px;color:#f6e7c4;text-shadow:0 3px 0 #6d0e0e,0 7px 20px rgba(0,0,0,.5)}
  .startbox p{font-style:italic;opacity:.85;margin:.2em 0 26px;font-family:var(--serif);font-size:18px}
  .btn{font-family:var(--retro);font-size:11px;background:var(--gold);color:#3a2410;border:0;padding:15px 22px;border-radius:6px;cursor:pointer;box-shadow:0 6px 0 #8a6a22,0 12px 22px rgba(0,0,0,.4)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6a22}

  /* ===== FLOATING PIECES ===== */
  .floaties{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .floaty{position:absolute;font-size:26px;opacity:.13;animation:drift linear infinite}
  @keyframes drift{0%{transform:translateY(112vh) rotate(0)}100%{transform:translateY(-14vh) rotate(360deg)}}

  /* ===== STAGE ===== */
  #stage{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;perspective:1600px}
  .scene{position:relative;width:min(94vw,440px);height:100%;max-height:900px}

  /* envelope */
  .env{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);width:100%;height:55%;z-index:6}
  .env .body{position:absolute;inset:0;background:linear-gradient(180deg,var(--kraft),var(--kraft-2));border:2px solid var(--kraft-edge);border-radius:10px 10px 6px 6px;box-shadow:var(--shadow)}
  .env .pocket{position:absolute;left:0;right:0;bottom:0;height:64%;background:linear-gradient(180deg,var(--kraft-2),#b1854f);border:2px solid var(--kraft-edge);border-top:3px solid rgba(90,60,30,.35);border-radius:6px;z-index:9}
  .env .pocket::before{content:"";position:absolute;left:8%;right:8%;top:6px;height:8px;background:rgba(255,245,225,.5);border-radius:4px}
  .env .ribbon{position:absolute;top:-40%;bottom:0;left:50%;width:15%;transform:translateX(-50%) rotate(1.5deg);background:linear-gradient(90deg,#9a3826,#c14c33,#9a3826);z-index:10}
  .env .ribbon::after{content:"";position:absolute;left:0;right:0;bottom:-24px;height:24px;
    background:linear-gradient(-45deg,transparent 49%,#a63f2b 50%) 0 0/12px 24px,linear-gradient(45deg,transparent 49%,#a63f2b 50%) 0 0/12px 24px}
  .env .flap{position:absolute;left:-1px;right:-1px;top:0;height:50%;background:linear-gradient(180deg,#c99a67,#bd8d59);border:2px solid var(--kraft-edge);
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s ease,opacity 1s ease;z-index:12}
  .env.opened .flap{transform:rotateX(180deg) scaleY(.62);opacity:0;z-index:4}
  .env .seal{position:absolute;left:50%;top:44%;width:96px;height:96px;transform:translate(-50%,-50%);z-index:14;transition:transform .55s ease,opacity .55s}
  .env .seal img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}
  .env.opened .seal{transform:translate(-50%,-280%) rotate(26deg);opacity:0}

  /* carrier = the player's own playing card */
  .carrier{position:absolute;left:50%;top:50%;width:72%;aspect-ratio:63/97;transform:translate(-50%,-52%) rotateY(90deg);
    z-index:20;opacity:0;transition:transform .4s ease,opacity .3s;transform-style:preserve-3d}
  .carrier.flash{animation:carry 1.5s ease}
  @keyframes carry{0%{opacity:0;transform:translate(-50%,-52%) rotateY(92deg) scale(.96)}
    38%{opacity:1;transform:translate(-50%,-52%) rotateY(0) scale(1)}
    66%{opacity:1;transform:translate(-50%,-52%) rotateY(0) scale(1)}
    100%{opacity:0;transform:translate(-50%,-52%) rotateY(-92deg) scale(.96)}}
  .pcard{position:absolute;inset:0;border-radius:12px;background:#fdfdf8;border:2px solid #2a2a2a;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pcard .cnr{position:absolute;font-family:var(--naipe);font-weight:700;line-height:.82;text-align:center;font-size:clamp(14px,3.8vw,18px)}
  .pcard .cnr.tl{top:8px;left:10px}
  .pcard .cnr.br{bottom:8px;right:10px;transform:rotate(180deg)}
  .pcard .mid{font-size:clamp(48px,14vw,66px);line-height:1}
  .pcard.red{color:#c0392b}.pcard.black{color:#1f1f1f}
  .pcard.joker{color:#7d4bd0}
  .pcard.back{background:repeating-linear-gradient(45deg,#8a2a1c 0 7px,#a5321f 7px 14px);border-color:#6d1c11}
  .pcard.back span{font-family:var(--display);font-weight:900;font-size:30px;color:#f3ead2;
    background:rgba(138,42,28,.9);border:2px solid #f3ead2;border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center}

  /* content card */
  .card{position:absolute;left:50%;top:50%;width:88%;aspect-ratio:63/97;transform:translate(-50%,140%) scale(.9);
    background:var(--card) url("../assets/hexbg.jpg") center/200% no-repeat;background-blend-mode:overlay;
    border-radius:14px;border:7px solid var(--gold-lt);box-shadow:var(--shadow),inset 0 0 0 2px var(--gold);
    z-index:8;opacity:0;transition:transform 1.5s cubic-bezier(.4,1.1,.4,1),opacity 1.5s;display:flex;flex-direction:column;overflow:hidden}
  .card.show{transform:translate(-50%,-52%) scale(1);opacity:1}
  .card.leaving{transform:translate(-165%,-70%) rotate(-15deg) scale(.9);opacity:0}
  /* inner gold frame — the boardgame-box look */
  .card::before{content:"";position:absolute;inset:9px;border:1.5px solid var(--gold-dk);border-radius:8px;opacity:.6;pointer-events:none;z-index:3}
  .card .cnr{position:absolute;font-family:var(--naipe);font-weight:700;font-size:28.5px;line-height:1;color:var(--red-deep);z-index:4}
  .card .cnr.tl{top:16px;left:18px}.card .cnr.br{bottom:16px;right:18px;transform:rotate(180deg)}
  .card .inner{flex:1;padding:26px clamp(12px,4.5vw,19px) 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;overflow:auto}
  .card .inner::-webkit-scrollbar{width:0}
  .card h2{font-family:var(--display);font-weight:700;color:var(--red-deep);margin:0;font-size:clamp(17px,5.4vw,28px);line-height:1.12}
  .card h3{font-family:var(--serif);font-weight:500;color:var(--kraft-edge);margin:2px 0;font-size:clamp(11px,3vw,13px);letter-spacing:2.4px;text-transform:uppercase}
  .card .kicker{font-family:var(--serif);font-size:clamp(17px,6vw,32px);color:var(--gold-dk);margin:0;letter-spacing:.5px}
  .card p{margin:3px 0;font-size:clamp(13px,3.5vw,15.5px);line-height:1.36}
  .card .mono{font-family:var(--mono);font-size:12px;letter-spacing:0}

  /* retro countdown — fixed bar above everything, always visible during play */
  .cd-bar{position:fixed;top:0;left:0;right:0;z-index:28;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:calc(6px + env(safe-area-inset-top)) 10px 6px;
    background:linear-gradient(180deg,rgba(36,29,23,.92),rgba(36,29,23,.78) 75%,transparent);
    opacity:0;pointer-events:none;transition:opacity .5s}
  .cd-bar.on{opacity:1}
  .cd-row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  .cd-unit{display:flex;flex-direction:column;align-items:center;gap:2px;background:#241d17;border-radius:6px;
    padding:5px 5px;min-width:36px;box-shadow:inset 0 0 0 2px #000,0 3px 0 rgba(0,0,0,.3)}
  .cd-num{font-family:var(--retro);font-size:13px;color:var(--gold-lt);text-shadow:0 0 6px rgba(230,200,119,.6)}
  .cd-lbl{font-family:var(--retro);font-size:6px;color:#c9a24a;letter-spacing:.5px}
  .cd-tz{font-family:var(--retro);font-size:7px;color:var(--paper);opacity:.75;letter-spacing:.3px}

  /* Grasshopper Solutions promo badge */
  .promo{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:95}
  .promo-circle{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.5);padding:0;cursor:pointer;
    background:#0a0a0a;box-shadow:0 4px 14px rgba(0,0,0,.45);overflow:hidden;display:flex;align-items:center;justify-content:center;
    transition:transform .2s}
  .promo-circle:hover,.promo-circle:active{transform:scale(1.08)}
  .promo-circle img{width:100%;height:100%;object-fit:cover}
  .promo-pop{position:absolute;top:50px;right:0;width:210px;background:#1a1410;color:#f3ead2;border:1px solid var(--gold);
    border-radius:10px;padding:10px 12px;font-family:var(--serif);font-size:13px;line-height:1.35;box-shadow:0 8px 20px rgba(0,0,0,.4);
    opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s}
  .promo-pop a{display:block;margin-top:5px;color:var(--gold-lt);font-family:var(--mono);font-size:11.5px;word-break:break-word}
  .promo.open .promo-pop{opacity:1;transform:translateY(0);pointer-events:auto}
  .card .big{font-family:var(--display);font-weight:700;font-size:clamp(24px,7vw,33px);color:var(--red-deep)}
  .card .amp{height:1em;vertical-align:-.12em;mix-blend-mode:multiply}
  .card hr.rule{width:62%;border:0;border-top:2px dotted var(--kraft-edge);margin:6px 0}
  .card a{color:var(--red);font-weight:600}
  .card img.photo{max-height:42%;border-radius:8px;border:4px solid var(--gold-lt);box-shadow:0 8px 18px rgba(0,0,0,.3)}
  .gico{width:auto;vertical-align:middle}

  /* scrabble tiles */
  .scrab-rows{display:flex;flex-direction:column;gap:8px;margin:6px 0;width:100%}
  .scrab{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;margin:2px 0}
  .stile{width:30px;height:30px;flex:0 0 auto;min-width:0;background:linear-gradient(160deg,#f6ecc9,#e6d29a);border-radius:5px;border:1px solid #b99a58;
    box-shadow:0 3px 0 #a5843f;font-family:var(--display);font-weight:700;font-size:17px;color:#7a5a1e;
    display:flex;align-items:center;justify-content:center;position:relative;transform:translateY(-90px);opacity:0}
  .stile.drop{animation:drop .36s cubic-bezier(.3,1.4,.5,1) forwards}
  @keyframes drop{to{transform:none;opacity:1}}
  .stile sub{position:absolute;right:2px;bottom:0;font-size:8px;font-weight:400}

  /* elementos list */
  .elem{width:100%;text-align:left;display:flex;flex-direction:column;gap:9px}
  .elem .row{display:flex;gap:11px;align-items:flex-start}
  .elem .row>img{width:40px;flex:0 0 40px;object-fit:contain;margin-top:2px}
  .elem .row>div{flex:1;min-width:0}
  .elem .row b{color:var(--red-deep);font-family:var(--mono);font-weight:600;font-size:13.5px;letter-spacing:-.3px}
  .elem .row small{display:block;font-size:12.5px;color:var(--ink-soft);line-height:1.32;font-family:var(--serif)}

  /* stat / box-back grid */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;font-family:var(--mono);font-size:11px}
  .stats div{background:rgba(255,250,235,.62);border:1px solid var(--kraft-edge);border-radius:6px;padding:6px 8px;text-align:left}
  .stats b{color:var(--red-deep);display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:1px}

  /* boardgame stat badges (extracted from the poker-chip asset) */
  .badges3{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
  .badges3 img{height:44px;width:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}

  .chipimg{width:clamp(120px,34vw,160px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}

  /* timeline */
  .phases{width:100%;display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:12.5px}
  .phases div{display:flex;gap:10px;align-items:baseline}
  .phases b{color:var(--red-deep);font-weight:700;min-width:34px}
  .phases i{flex:1;border-bottom:1px dotted var(--kraft-edge);font-style:normal}

  /* map */
  svg.map,img.map{width:100%;height:auto;border-radius:8px;border:2px solid var(--kraft-edge);background:#e8f1e6;display:block}
  img.map{max-height:min(30vh,200px);object-fit:contain}

  /* title banner images (replace text titles on some cards) */
  .title-banner{width:min(92%,340px);height:auto;display:block;margin:0 auto}
  .legend{width:100%;display:flex;flex-direction:column;gap:7px;text-align:left;margin-top:4px}
  .legend .row{display:flex;gap:9px;align-items:flex-start}
  .legend .row:nth-child(even){flex-direction:row-reverse;text-align:right}
  .legend .row img{width:30px;flex:0 0 30px;object-fit:contain}
  .legend .row small{font-family:var(--mono);font-size:11px;line-height:1.3}
  .legend .row small b{color:var(--red-deep)}

  /* objetivos / regras with role icons */
  .role{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:2px}
  .role img{height:44px;width:auto}
  .role span{font-family:var(--serif);font-size:clamp(15px,5.5vw,26px);color:var(--gold-dk)}
  .ruleslist{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px}
  .ruleslist .r{display:flex;gap:8px;font-size:12.5px;line-height:1.3}
  .ruleslist .r span{flex:0 0 16px;text-align:center}

  .uno{width:78px;transform:rotate(-5deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
  .uno img{width:100%;display:block}

  .rsvp{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .rsvp button{text-decoration:none;font-family:var(--retro);font-weight:400;font-size:9px;line-height:1.5;padding:11px 14px;border-radius:9px;
    border:0;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s,opacity .2s}
  .rsvp button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .rsvp button:disabled{opacity:.55;cursor:default;transform:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .rsvp .yes{background:var(--green);color:#fff}
  .rsvp .no{background:#7a7a7a;color:#fff}
  .rsvp-status{min-height:1.1em;font-size:12.5px;font-family:var(--mono)}
  .rsvp-status.ok{color:var(--green)}
  .rsvp-status.err{color:var(--red-deep)}

  .finale{display:flex;gap:16px;align-items:center;justify-content:center}
  .finale img{height:clamp(40px,12vw,54px);width:auto;mix-blend-mode:multiply}

  /* name-check */
  .nc{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
  .nc input{font-family:var(--serif);font-size:16px;padding:10px 12px;border:2px solid var(--kraft-edge);border-radius:9px;background:#fffdf5;width:100%;max-width:250px;text-align:center}
  .nc button{font-family:var(--retro);font-weight:400;font-size:10px;background:var(--red);color:#fff;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;box-shadow:0 4px 0 var(--red-deep)}
  .nc button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-deep)}
  .nc .res{font-size:13px;line-height:1.35;font-family:var(--serif)}
  .nc .res.ask{color:#8a6a1e}.nc .res.no{color:var(--red-deep)}
  .nc .res .opt{display:inline-block;background:rgba(255,250,235,.72);border:1px solid var(--kraft-edge);border-radius:6px;padding:2px 7px;margin:3px 3px 0;cursor:pointer;font-weight:600}

  /* HUD */
  #hud{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:9px;
    padding:12px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    opacity:0;transition:opacity .5s;pointer-events:none}
  #hud.on{opacity:1;pointer-events:auto}
  .pips{display:flex;gap:6px}
  .pips i{width:8px;height:8px;border-radius:50%;background:rgba(120,80,40,.35);transition:.3s;cursor:pointer}
  .pips i.act{background:var(--red-deep);transform:scale(1.4)}
  .nav{display:flex;gap:8px}
  .nav button{font-family:var(--retro);font-weight:400;font-size:9px;border:0;border-radius:8px;padding:10px 13px;cursor:pointer;background:var(--kraft-edge);color:var(--paper);box-shadow:0 4px 0 #6e4e28}
  .nav button:active{transform:translateY(3px);box-shadow:0 1px 0 #6e4e28}
  .nav button.primary{background:var(--red);box-shadow:0 4px 0 var(--red-deep)}
  .nav button:disabled{opacity:.4}
  .quip{position:fixed;left:50%;top:9%;transform:translateX(-50%);z-index:25;font-family:var(--retro);font-size:10px;

<script>
(function(){
  "use strict";
  var GROUPS = JSON.parse(document.getElementById('guests').textContent);
  var A='../assets/';

  /* floating pieces */
  var bits=["♟","♜","♞","🎲","🃏","🎯","🀄","🁣","♠","♥","♦","♣","🧩","🎴","👑","💍","♚","⏳"];
  var fl=document.getElementById('floaties');
  for(var i=0;i<16;i++){var s=document.createElement('div');s.className='floaty';s.textContent=bits[i%bits.length];
    s.style.left=(Math.random()*100)+'%';s.style.animationDuration=(16+Math.random()*22)+'s';
    s.style.animationDelay=(-Math.random()*32)+'s';s.style.fontSize=(15+Math.random()*26)+'px';fl.appendChild(s);}

  function norm(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/\s+/g,' ');}
  var SCORES={a:1,b:3,c:3,d:2,e:1,f:4,g:2,h:4,i:1,j:8,l:1,m:3,n:1,o:1,p:3,q:10,r:1,s:1,t:1,u:1,v:4,x:8,z:10,k:5,w:4,y:4};
  function tilesHTML(name){
    return '<div class="scrab">'+name.toUpperCase().split('').map(function(ch){
      var sc=SCORES[ch.toLowerCase()];
      return '<div class="stile">'+(ch===' '?'&nbsp;':ch)+(sc?'<sub>'+sc+'</sub>':'')+'</div>';
    }).join('')+'</div>';
  }
  function dropTiles(scope){scope.querySelectorAll('.stile').forEach(function(t,i){setTimeout(function(){t.classList.add('drop');},1000+i*200);});}
  function fitScrabRows(scope){
    scope.querySelectorAll('.scrab-rows').forEach(function(rows){
      var w=rows.clientWidth; if(!w)return;
      var gap=4, rowEls=[].slice.call(rows.querySelectorAll('.scrab'));
      var size=rowEls.reduce(function(min,row){
        var n=row.children.length; if(!n)return min;
        return Math.min(min,Math.floor((w-gap*(n-1))/n));
      },30);
      size=Math.max(12,Math.min(30,size));
      rowEls.forEach(function(row){
        [].forEach.call(row.children,function(t){t.style.width=t.style.height=size+'px';t.style.fontSize=Math.max(9,Math.round(size*.56))+'px';});
      });
    });
  }
  function firstName(n){return (n||'').split(' ')[0];}

  /* ---------- guest search ---------- */
  function search(raw){
    var q=norm(raw); if(!q) return {t:'empty'};
    var toks=q.split(' ');
    var hits=GROUPS.filter(function(g){return toks.every(function(t){return g.q.indexOf(t)>-1;});});
    if(hits.length===1) return {t:'ok',g:hits[0]};
    if(hits.length>1)  return {t:'ask',list:hits};
    return {t:'no'};
  }

  /* ---------- player's card ---------- */
  var player=null;
  function suitColor(s){return (s==='♥'||s==='♦')?'red':'black';}
  function pcardHTML(g){
    if(!g||g.joker){
      return '<div class="pcard joker"><div class="cnr tl">J<br>O<br>K<br>E<br>R</div><div class="mid">🃏</div><div class="cnr br">J<br>O<br>K<br>E<br>R</div></div>';
    }
    var c=g.rank+g.suit;
    return '<div class="pcard '+suitColor(g.suit)+'"><div class="cnr tl">'+c+'</div><div class="mid">'+g.suit+'</div><div class="cnr br">'+c+'</div></div>';
  }
  function cardLabel(g){return (!g||g.joker)?'JOKER':g.rank+g.suit;}
  function setCarrier(g){carrier.innerHTML = g===undefined ? '<div class="pcard back"><span>M&amp;S</span></div>' : pcardHTML(g);}

  /* ---------- deck ---------- */
  var CHURCH="Igreja Matriz de São João Baptista das Lampas, Av. Central 2705-737 São João das Lampas";
  var QUINTA="Quinta da Praia, Estrada da Aguda, Rua do Roligo 52, 2705-623 Fontanelas";
  var MAP_CH="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(CHURCH);
  var MAP_Q ="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(QUINTA);
  var RSVP_WHATSAPP="+351964412547";

  function greetCard(){
    if(!player && !identified){
      return '<h3>Atenção, Jogador</h3>'+
        '<p>a tua presença é requisitada no tabuleiro</p>'+
        '<img class="title-banner" src="'+A+'title_the_game.png" alt="M&amp;S — O Jogo · Expansão: Aliança Estratégica">'+
        '<p style="font-style:italic">Quem está no tabuleiro?</p>';
    }
    if(!player){
      return '<h3>Atenção, Jogador</h3>'+
        '<img class="gico" style="height:70px" src="'+A+'i_ring.png" alt="">'+
        '<p>Não te encontrámos no baralho — mas a mesa é grande.</p>'+
        '<p class="mono">Entras como JOKER 🃏. Fala com os noivos para confirmar o teu lugar.</p>'+
        '<p><b>Prepara os dados!</b> 🎲</p>';
    }
    var fns=player.names.map(firstName);
    var plural=fns.length>1;
    var namesHTML='<div class="scrab-rows">'+fns.map(function(n,i){return tilesHTML(i<fns.length-1?n+'&':n);}).join('')+'</div>';
    return '<h3>Atenção, '+(plural?'Jogadores':'Jogador')+'</h3>'+
      namesHTML+
      '<p>a '+(plural?'vossa':'tua')+' presença é requisitada no tabuleiro</p>'+
      '<img class="title-banner" style="width:min(80%,280px)" src="'+A+'title_the_game.png" alt="M&amp;S — O Jogo · Expansão: Aliança Estratégica">'+
      '<img class="gico" style="height:58px" src="'+A+'i_ring.png" alt="">'+
      '<p>A '+(plural?'vossa':'tua')+' carta: <b>'+cardLabel(player)+'</b>'+(player.nocard?' <span class="mono">(JOKER)</span>':'')+'</p>'+
      '<p><b>Prepara os dados!</b> 🎲</p>';
  }

  var steps=[
    { id:'greet', cnr:['♣','♦'], build:greetCard },

    { id:'couple', cnr:['M♥','S♠'], build:function(){
        return '<img class="photo" src="'+A+'couple.jpg" alt="Miguel &amp; Sofia">'+
          '<img class="title-banner" src="'+A+'title_strategic_alliance.png" alt="Miguel Comba &amp; Sofia Moreira · Aliança Estratégica">'+
          '<div class="big">12 de Junho de 2027</div>'+
          '<p style="font-style:italic">"Advance to the altar."</p>';
      }},

    { id:'ficha', cnr:['🎲','🃏'], build:function(){
        return '<img class="chipimg" src="'+A+'chip_gold.png" alt="Ficha M&amp;S">'+
          '<img class="title-banner" style="margin-top:4px" src="'+A+'title_the_game.png" alt="M&amp;S — O Jogo · Expansão: Aliança Estratégica">'+
          '<div class="badges3" style="margin-top:10px"><img src="'+A+'b_convidados.png" alt="2 noivos + convidados">'+
            '<img src="'+A+'b_age.png" alt="0 a 100 anos"><img src="'+A+'b_time.png" alt="12 horas"></div>';
      }},

    { id:'elem', cnr:['♜','♞'], build:function(){
        function row(icL,t,d,icR){return '<div class="row"><img src="'+A+icL+'" alt=""><div><b>'+t+'</b><small>'+d+'</small></div>'+(icR?'<img src="'+A+icR+'" alt="">':'')+'</div>';}
        return '<p class="kicker">Elementos</p>'+
          '<div class="elem">'+
          row('i_king.png','2 Noivos','Miguel &amp; Sofia','i_queen.png')+
          row('i_puzzle.png','2 Tabuleiros',
            '<a href="'+MAP_CH+'" target="_blank" rel="noopener">Igreja Matriz de S. João Baptista das Lampas ›</a><br>'+
            '<a href="'+MAP_Q+'" target="_blank" rel="noopener">Quinta da Praia ›</a>','i_moneybag.png')+
          row('i_domino.png','1 Dia de Jogo','12 de Junho de 2027 · Sábado','i_die.png')+
          row('i_pawn.png','1 Combinação Especial','Convidados, Comida, Animação e Diversão','i_meeple.png')+
          '</div>';
      }},

    { id:'board', cnr:['♗','♛'], build:function(){
        return '<p class="kicker">O Tabuleiro</p>'+
          '<img class="map" src="'+A+'hexagon_map.jpg" alt="Percurso da Igreja à Quinta">'+
          '<div class="legend">'+
          '<div class="row"><img src="'+A+'i_bishop.png" alt=""><small><b><a href="'+MAP_CH+'" target="_blank" rel="noopener">Igreja Matriz de São João Baptista das Lampas ›</a></b><br>Av. Central, 2705-737 · São João das Lampas</small></div>'+
          '<div class="row"><img src="'+A+'i_tent.png" alt=""><small><b><a href="'+MAP_Q+'" target="_blank" rel="noopener">Quinta da Praia ›</a></b><br>Est. da Aguda, R. do Roligo 52 · 2705-623 Fontanelas</small></div>'+
          '<div class="row"><img src="'+A+'i_hourglass.png" alt=""><small>Percurso da Igreja à Quinta ± 10 min</small></div>'+
          '<div class="row"><img src="'+A+'i_car.png" alt=""><small>Estacionamento livre na Igreja e na Quinta</small></div>'+
          '</div>';
      }},

    { id:'prep', cnr:['⏱','🎲'], build:function(){
        return '<div class="role"><img src="'+A+'i_chest.png" alt=""><span>Preparação do Tabuleiro</span></div>'+
          '<div class="stats" style="margin-top:2px">'+
            '<div><b>Nº de Jogadores</b>2 noivos + Convidados</div>'+
            '<div><b>Duração</b>1 Dia</div>'+
            '<div><b>Idade recomendada</b>0 aos 100</div>'+
            '<div><b>Código de Equipamento</b>Casual</div></div>'+
          '<p class="mono" style="margin-top:8px;font-weight:700;letter-spacing:.5px">FASES DO JOGO</p>'+
          '<div class="phases">'+
          '<div><b>10H</b><i>Chegada à Igreja</i></div>'+
          '<div><b>12H</b><i>Chegada à Quinta</i></div>'+
          '<div><b>13H</b><i>Almoço</i></div>'+
          '<div><b>18H</b><i>Corte do Bolo</i></div>'+
          '<div><b>19H</b><i>Ceia</i></div>'+
          '<div><b>22H</b><i>Fim da Partida</i></div>'+
          '</div>';
      }},

    { id:'objetivos', cnr:['♥','♣'], build:function(){
        return '<div class="role"><img src="'+A+'i_herald.png" alt=""><span>Objetivos</span></div>'+
          '<p style="font-size:13px">Une forças no jogo mais importante de Miguel &amp; Sofia e ajuda-os a alcançar um dia inesquecível.</p>'+
          '<p style="font-size:13px"><b>Modo de jogo:</b> Estratégia e Cooperação total com Diversão incorporada.</p>'+
          '<p style="font-size:13px"><b>Penalização:</b> Chegar tarde à igreja faz perder o turno. Reúne com o grupo na Quinta.</p>';
      }},

    { id:'regras', cnr:['♦','♠'], build:function(){
        return '<div class="role"><img src="'+A+'i_referee.png" alt=""><span>Regras</span></div>'+
          '<div class="ruleslist">'+
          '<div class="r"><span style="color:#c0392b">♥</span><div>Descarta do baralho as cartas de <b>orgulho</b>, <b>teimosia</b> e <b>drama</b>.</div></div>'+
          '<div class="r"><span>♣</span><div>Evita bloqueios estratégicos no buffet.</div></div>'+
          '<div class="r"><span style="color:#c0392b">♦</span><div>Cada foto é uma recordação — junta-as e ganha bónus.</div></div>'+
          '<div class="r"><span>♠</span><div>A pista de dança é zona neutra: invadam livremente.</div></div>'+
          '<div class="r"><span>🎴</span><div><b>Regra da Casa:</b> apostar nos noivos é sempre uma boa jogada.</div></div>'+
          '</div>';
      }},

    { id:'rsvp', cnr:['+2','🃏'], build:function(){
        var yesLabel = player && player.names.length>1 ? 'CONTA CONNOSCO' : 'CONTA COMIGO';
        return '<h2>Chegou a vossa vez!</h2>'+
          '<p>Lancem o dado e registem a jogada até <b>12/03/2027</b>.</p>'+
          '<div class="uno"><img src="'+A+'i_unocard.png" alt="+2"></div>'+

            '<button type="button" class="yes" data-attend="yes">🎲 '+yesLabel+'</button>'+

          '</div>'+

          '<p class="mono" style="margin-top:8px">Para jogadores extra, contactar os noivos.</p>';
      }},

    { id:'end', cnr:['♟','♜'], build:function(){
        return '<div class="finale"><img src="'+A+'rook.png" alt="torre"><img src="'+A+'chip.png" alt="ficha M&amp;S"><img src="'+A+'die.png" alt="dado"></div>'+
          '<h2>Sem ti, o jogo<br>não fica… completo.</h2>'+
          '<p style="font-style:italic">Miguel <img class="amp" src="'+A+'amp.jpg" alt="&amp;"> Sofia · 12·06·2027</p>'+
          '<div class="badges3" style="margin-top:4px"><img src="'+A+'b_convidados.png" alt=""><img src="'+A+'b_age.png" alt=""><img src="'+A+'b_time.png" alt=""></div>';
      }}
  ];

  var QUIPS=["Yahtzee!","Xeque-mate.","UNO!","É a tua vez.","Player 2 entrou no jogo.","Do not pass GO.","Casa da sorte.","Full house.","Bingo!","Duplo 6.","+4 para ti.","Level up."];

  /* ---------- flow ---------- */
  var curtain=document.getElementById('curtain'),env=document.getElementById('env'),
      card=document.getElementById('card'),inner=document.getElementById('cardInner'),
      cnrTL=document.getElementById('cnrTL'),cnrBR=document.getElementById('cnrBR'),
      carrier=document.getElementById('carrier'),hud=document.getElementById('hud'),cdBar=document.getElementById('cdBar'),
      pipsEl=document.getElementById('pips'),tapHint=document.getElementById('tapHint'),
      quip=document.getElementById('quip'),
      btnNext=document.getElementById('next'),btnPrev=document.getElementById('prev');
  var idx=-1,busy=false,started=false,identified=false;

  steps.forEach(function(_,i){var d=document.createElement('i');d.addEventListener('click',function(){go(i);});pipsEl.appendChild(d);});
  function paintPips(){[].forEach.call(pipsEl.children,function(d,i){d.className=i===idx?'act':'';});}
  function setCnr(a){
    cnrTL.innerHTML=String(a[0]);
    cnrBR.innerHTML=String(a[1]);
  }
  function showQuip(){ if(idx<=0)return; quip.textContent=QUIPS[(idx-1)%QUIPS.length];
    quip.classList.remove('show');void quip.offsetWidth;quip.classList.add('show'); }

  function renderStep(i){
    var s=steps[i];
    setCnr(player?[cardLabel(player),cardLabel(player)]:s.cnr);
    inner.innerHTML=s.build();
    dropTiles(inner);
    fitScrabRows(inner);
    if(s.id==='greet') wireGreet();
    if(s.id==='rsvp') wireRsvp();

    btnNext.textContent = i===steps.length-1 ? 'FIM' : 'SEGUINTE ›';
    if(i>0) tapHint.hidden = (i===steps.length-1);
  }

  function go(i){
    if(busy||i<0||i>=steps.length||i===idx)return;
    if(i>0 && !identified){ flash(); return; }

    if(idx>=0){card.classList.add('leaving');card.classList.remove('show');}
    carrier.classList.remove('flash');void carrier.offsetWidth;
    setCarrier(identified?player:undefined);

      card.classList.remove('leaving');
      idx=i;renderStep(i);paintPips();
      void card.offsetWidth;card.classList.add('show');
      busy=false;
    }, idx>=0?960:420);
  }
  function flash(){card.animate([{transform:'translate(-50%,-52%) scale(1)'},{transform:'translate(-50%,-52%) scale(1.02) rotate(-1deg)'},{transform:'translate(-50%,-52%) scale(1)'}],{duration:220});}

  function wireRsvp(){

    var wrap=document.createElement('div');wrap.className='nc';
    wrap.innerHTML='<input id="ncq" type="text" placeholder="O teu nome (ex.: Nuno)" autocomplete="off" spellcheck="false">'+
                   '<button id="ncgo">PROCURAR</button><div class="res" id="ncres"></div>';
    inner.appendChild(wrap);
    var q=document.getElementById('ncq'),go2=document.getElementById('ncgo'),res=document.getElementById('ncres');
    function run(){
      var r=search(q.value);
      if(r.t==='empty'){res.className='res ask';res.textContent='Escreve o teu nome.';return;}
      if(r.t==='ok'){ identify(r.g); return; }
      if(r.t==='ask'){
        res.className='res ask';
        res.innerHTML='Há mais do que um jogador. Toca no teu nome:<br>'+
          r.list.map(function(g,k){return '<span class="opt" data-k="'+k+'">'+g.names.join(' & ')+'</span>';}).join('');
        res.querySelectorAll('.opt').forEach(function(el){el.addEventListener('click',function(){identify(r.list[+el.dataset.k]);});});
        return;
      }
      res.className='res no';
      res.innerHTML='<b>GAME OVER</b> — não encontrámos "'+q.value.trim()+'" no baralho.<br>'+
        '<span class="opt" id="joker">Entrar como JOKER</span> ou confirmar com os noivos.';
      document.getElementById('joker').addEventListener('click',function(){ identify(null); });
    }
    go2.addEventListener('click',run);
    q.addEventListener('keydown',function(e){if(e.key==='Enter')run();});
    setTimeout(function(){try{q.focus();}catch(e){}},400);
  }
  function identify(g){
    player=g; identified=true;
    setCarrier(player);
    inner.innerHTML=steps[0].build();
    dropTiles(inner);
    fitScrabRows(inner);
    setCnr([cardLabel(player),cardLabel(player)]);
    btnNext.disabled=false; tapHint.hidden=false;
    carrier.classList.remove('flash');void carrier.offsetWidth;carrier.classList.add('flash');
    quip.textContent = player ? ('A '+(player.names.length>1?'vossa':'tua')+' carta: '+cardLabel(player)) : 'Curinga selvagem!';
    quip.classList.remove('show');void quip.offsetWidth;quip.classList.add('show');
  }

  function begin(){
    if(started)return;started=true;
    curtain.classList.add('open');
    setTimeout(function(){curtain.classList.add('gone');},1600);
    setTimeout(function(){env.classList.add('opened');},1300);
    setTimeout(function(){hud.classList.add('on');cdBar.classList.add('on');go(0);btnNext.disabled=true;},2000);
  }
  document.getElementById('startBtn').addEventListener('click',begin);

  btnNext.addEventListener('click',function(){go(idx+1);});
  btnPrev.addEventListener('click',function(){go(idx-1);});
  document.getElementById('replay').addEventListener('click',function(){
    location.reload();
  });
  document.getElementById('stage').addEventListener('click',function(e){
    if(!started||busy)return;
    if(e.target.closest('.nc')||e.target.closest('a')||e.target.closest('.rsvp')||e.target.closest('button'))return;
    if(idx===0 && !identified)return;
    tapHint.hidden=true;
    if(idx<steps.length-1) go(idx+1);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){go(idx+1);}
    if(e.key==='ArrowLeft'){go(idx-1);}
  });

  /* Grasshopper Solutions promo badge */
  var promo=document.getElementById('promo'),promoCircle=document.getElementById('promoCircle');
  promoCircle.addEventListener('click',function(e){
    e.stopPropagation();
    var open=promo.classList.toggle('open');
    promoCircle.setAttribute('aria-expanded',open?'true':'false');
  });
  document.addEventListener('click',function(e){
    if(promo.classList.contains('open') && !promo.contains(e.target)) promo.classList.remove('open');
  });

  /* retro countdown to the wedding — 12/06/2027, 10H (Europe/Lisbon, WEST = UTC+1) */
  var WEDDING_UTC = Date.UTC(2027,5,12,9,0,0,0);
  var cdTz = 'Europe/Lisbon';
  try{ cdTz = Intl.DateTimeFormat().resolvedOptions().timeZone || cdTz; }catch(e){}
  function pad(n,len){ n=String(Math.max(0,Math.floor(n))); while(n.length<len) n='0'+n; return n; }
  function tickCountdown(){
    var elD=document.getElementById('cdD'); if(!elD)return;
    var diff=Math.max(0,WEDDING_UTC-Date.now());
    var ms=diff%1000; diff=(diff-ms)/1000;
    var s=diff%60; diff=(diff-s)/60;
    var m=diff%60; diff=(diff-m)/60;
    var h=diff%24; diff=(diff-h)/24;
    elD.textContent=pad(diff,3);
    document.getElementById('cdH').textContent=pad(h,2);
    document.getElementById('cdM').textContent=pad(m,2);
    document.getElementById('cdS').textContent=pad(s,2);
    document.getElementById('cdMs').textContent=pad(ms,3);
    var elTz=document.getElementById('cdTz'); if(elTz) elTz.textContent='fuso horário: '+cdTz;
  }
  setInterval(tickCountdown,47);
  tickCountdown();
})();
</script>
</body>
</html>
